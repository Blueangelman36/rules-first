name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # No API key here, and none is needed: the Claude teacher is tested against a
      # stand-in client that records what it would have sent.
      - run: python -m unittest discover -s tests -t . -v
      - name: The README's example runs as written
        run: python examples/quickstart.py
        env:
          PYTHONPATH: .

  claude-sdk:
    # The request ClaudeTeacher builds, checked against the real SDK's signature, so
    # an SDK release that renames a parameter fails here instead of in someone's feed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install "anthropic>=2.3"
      - name: Every keyword ClaudeTeacher sends is one the SDK accepts
        run: |
          python - <<'PY'
          import inspect, anthropic
          from rules_first.claude import ClaudeTeacher
          from rules_first import Classifier
          clf = Classifier()
          clf.classify("disk /dev/sda1 at 91% used")
          sent = ClaudeTeacher(client=object()).request(clf.parked(), None)
          accepted = inspect.signature(anthropic.Anthropic(api_key="unused").beta.messages.create).parameters
          missing = sorted(set(sent) - set(accepted))
          assert not missing, f"the SDK does not accept: {missing}"
          print("accepted:", sorted(sent))
          PY

  package:
    # What `pip install rules-first` will get, built and installed outside the source
    # tree, so nothing passes only because the tests run from the checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"  # the oldest requires-python allows
      - name: Build, and check what PyPI will render
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel in a clean environment and use it
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          unzip -l dist/*.whl | grep -q 'dist-info/licenses/LICENSE'
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/examples/quickstart.py"
